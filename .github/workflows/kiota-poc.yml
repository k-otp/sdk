name: Kiota multi-language PoC

on:
  workflow_dispatch:
  pull_request:
    branches: [main, poc/kiota-multilang]
    paths: ["spec/openapi.json", ".github/workflows/kiota-poc.yml", "poc/kiota/**", "docs/kiota-poc-results.md"]
  push:
    branches: [poc/kiota-multilang]
    paths: ["spec/openapi.json", ".github/workflows/kiota-poc.yml", "poc/kiota/**", "docs/kiota-poc-results.md"]

permissions:
  contents: read

concurrency:
  group: kiota-poc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"
  KIOTA_OFFLINE_ENABLED: "true"
  KIOTA_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: matrix
        run: bun run poc/kiota/scripts/matrix.ts

  investigate:
    name: ${{ matrix.target }} / ${{ matrix.variant }}
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup pinned Kiota
        uses: microsoft/setup-kiota@111eb592b2b3b2602ba9e0d979d4a4509cd59bb5 # v0.5.0
        with:
          version: v1.35.0
      - name: Discover, generate and compare clean regenerations
        run: bun run poc/kiota/scripts/generate.ts "${{ matrix.target }}" "${{ matrix.variant }}"
      - name: Upload evidence (including failed stages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiota-${{ matrix.target }}-${{ matrix.variant }}
          path: .cache/kiota-poc/runs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  report:
    name: Evidence report and required-language gate
    needs: [matrix, investigate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: microsoft/setup-kiota@111eb592b2b3b2602ba9e0d979d4a4509cd59bb5 # v0.5.0
        with:
          version: v1.35.0
      - name: Download only this run's evidence
        uses: actions/download-artifact@v5
        with:
          pattern: kiota-*
          merge-multiple: true
          path: .cache/kiota-poc/runs/
      - name: Verify Swift is unsupported by the pinned CLI
        if: always()
        run: bun run poc/kiota/scripts/generate.ts Swift raw
      - name: Collect stage report
        if: always()
        run: bun run poc/kiota/scripts/report.ts
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiota-evidence-report
          path: .cache/kiota-poc/runs/aggregate/
          if-no-files-found: error
          retention-days: 14
      - name: Require real build, wire, package and regeneration evidence
        if: always()
        run: bun run poc/kiota/scripts/report.ts --gate
