name: Kiota multi-language PoC

on:
  workflow_dispatch:
  push:
    branches:
      - poc/kiota-multilang
    paths:
      - "spec/openapi.json"
      - ".github/workflows/kiota-poc.yml"

permissions:
  contents: read

jobs:
  generate:
    name: Generate ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: CSharp
            namespace: KOtp.Sdk.Generated
          - language: Go
            namespace: kotp
          - language: Java
            namespace: dev.kotp.sdk.generated
          - language: PHP
            namespace: KOtp\\Sdk\\Generated
          - language: Python
            namespace: kotp_sdk_generated
          - language: Ruby
            namespace: KOtpSdkGenerated
          - language: Swift
            namespace: KOtpSdkGenerated
          - language: TypeScript
            namespace: KOtpSdkGenerated

    steps:
      - uses: actions/checkout@v5

      # Official Microsoft setup action. Keep this pinned during the PoC so
      # generated diffs are attributable to the OpenAPI document, not Kiota.
      - name: Setup Kiota
        uses: microsoft/setup-kiota@v0.5.0

      - name: Show Kiota version
        run: kiota --version

      - name: Generate client
        id: generate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "poc-output/${{ matrix.language }}"
          kiota generate \
            --openapi spec/openapi.json \
            --language "${{ matrix.language }}" \
            --class-name KOtpApiClient \
            --namespace-name "${{ matrix.namespace }}" \
            --output "poc-output/${{ matrix.language }}" \
            --clean-output \
            --log-level Information \
            2>&1 | tee "poc-output/${{ matrix.language }}/kiota-generate.log"

      - name: Inventory generated output
        if: always()
        shell: bash
        run: |
          {
            echo "# ${{ matrix.language }}"
            echo
            echo "Files: $(find "poc-output/${{ matrix.language }}" -type f 2>/dev/null | wc -l | tr -d ' ')"
            echo
            echo "## Extensions"
            find "poc-output/${{ matrix.language }}" -type f 2>/dev/null \
              | sed 's/.*\.//' | sort | uniq -c | sort -nr || true
            echo
            echo "## Potential K-OTP schema hotspots"
            grep -R -n -E "webOtp|smsFallback|idempotency|Idempotency|additionalData|AdditionalData" \
              "poc-output/${{ matrix.language }}" 2>/dev/null | head -80 || true
          } | tee "poc-output/${{ matrix.language }}/POC-INVENTORY.md"

      - name: Upload generated client
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiota-${{ matrix.language }}
          path: poc-output/${{ matrix.language }}
          if-no-files-found: warn
          retention-days: 14

  kotlin-compat-plan:
    name: Kotlin/JVM compatibility gate
    runs-on: ubuntu-latest
    needs: generate
    if: always()
    steps:
      - uses: actions/checkout@v5
      - name: Record Kotlin strategy
        run: |
          mkdir -p poc-output/Kotlin
          cat > poc-output/Kotlin/README.md <<'EOF'
          # Kotlin compatibility PoC

          Kiota has no dedicated Kotlin generator. K-OTP will treat the generated
          Java client as the JVM SDK candidate and validate it from Kotlin.

          The next PoC gate, after reviewing the generated Java artifact, is:
          1. create a minimal Gradle JVM fixture,
          2. compile the generated Java client with its Kiota runtime dependencies,
          3. compile Kotlin code that constructs the client and exercises issue,
             verify, status, balance and template request builders,
          4. record Java interop pain points (nullable types, builders, enums/unions,
             async return types), and
          5. decide whether a thin Kotlin facade is warranted.

          This job intentionally does not claim Kotlin compatibility before the
          generated Java dependency graph has been inspected.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: kiota-Kotlin-plan
          path: poc-output/Kotlin
          retention-days: 14
