name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  verify:
    name: Typecheck, lint, test, build, pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore ttsc plugin cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/ttsc
          key: ttsc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'lint.config.ts') }}
          restore-keys: |
            ttsc-${{ runner.os }}-${{ runner.arch }}-

      - name: Warn if changeset missing
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Three-dot diff: only the PR's own changes since the merge base.
          CHANGED="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          if echo "$CHANGED" | grep -Eq '^packages/[^/]+/(src/|package\.json)'; then
            if ! echo "$CHANGED" | grep -q '^\.sampo/changesets/.*\.md$'; then
              echo "::warning::Releasable package changes without a Sampo changeset. Run 'sampo add' and commit the file under .sampo/changesets/."
            fi
          fi

      - name: Typecheck (ttsc)
        run: bun run typecheck

      - name: Lint (Biome)
        run: bun run lint --diagnostic-level=error

      - name: OpenAPI drift (generated types + contract vs spec/openapi.json)
        run: bun run check:openapi

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Package artifacts (bun pm pack)
        run: bun run check:pack

      - name: Bundle size budgets
        run: bun run size

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          if-no-files-found: error
          retention-days: 7

  node-smoke:
    name: Built output on Node ${{ matrix.node }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: packages

      - name: Smoke test ESM, CJS and IIFE builds
        run: node scripts/smoke-dist.mjs

  examples:
    name: Examples (typecheck, build, smoke, e2e)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: packages

      - name: Typecheck, build and smoke-test examples
        run: bun run check:examples

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: UI components end to end (examples, mock API)
        run: bun run e2e:examples

  adapter-compat:
    name: Adapters on React ${{ matrix.react }} / Svelte ${{ matrix.svelte }} / Vue ${{ matrix.vue }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        react: ["18", "19"]
        svelte: ["4", "5"]
        vue: ["3.5"]
        include:
          # The oldest supported Vue (peer dependency >= 3.3), once.
          - react: "19"
            svelte: "5"
            vue: "3.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Pin framework versions
        run: bun run scripts/set-framework-versions.ts --react "${{ matrix.react }}" --svelte "${{ matrix.svelte }}" --vue "${{ matrix.vue }}"

      - name: Install dependencies
        # The catalog was changed on purpose, so the lockfile cannot be frozen.
        run: bun install

      - name: Adapter and parity tests
        env:
          EXPECT_REACT_MAJOR: ${{ matrix.react }}
          EXPECT_SVELTE_MAJOR: ${{ matrix.svelte }}
          EXPECT_VUE_MINOR: ${{ matrix.vue }}
        run: bun run --cwd tests test
