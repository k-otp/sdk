name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  verify:
    name: Typecheck, lint, test, build, pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore ttsc plugin cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/ttsc
          key: ttsc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'lint.config.ts') }}
          restore-keys: |
            ttsc-${{ runner.os }}-${{ runner.arch }}-

      - name: Warn if changeset missing
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          if echo "$CHANGED" | grep -Eq '^packages/[^/]+/(src/|package\.json)'; then
            if ! echo "$CHANGED" | grep -q '^\.sampo/changesets/.*\.md$'; then
              echo "::warning::Releasable package changes without a Sampo changeset. Run 'sampo add' and commit the file under .sampo/changesets/."
            fi
          fi

      - name: Typecheck (ttsc)
        run: bun run typecheck

      - name: Lint (Biome)
        run: bun run lint --diagnostic-level=error

      - name: OpenAPI drift (generated types + contract vs spec/openapi.json)
        run: bun run check:openapi

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Package artifacts (bun pm pack)
        run: bun run check:pack

      - name: Bundle size budgets
        run: bun run size

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          retention-days: 7

  node-smoke:
    name: Built output on Node ${{ matrix.node }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: packages

      - name: Smoke test ESM, CJS and IIFE builds
        run: node scripts/smoke-dist.mjs
