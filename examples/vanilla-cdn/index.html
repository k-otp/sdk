<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-OTP + script tag</title>
    <!--
      Local build of @k-otp/sdk-core (served by serve.ts). In production load it
      from jsDelivr with an EXACT version and Subresource Integrity:

      <script
        src="https://cdn.jsdelivr.net/npm/@k-otp/sdk-core@0.1.0/dist/k-otp.iife.min.js"
        integrity="sha384-REPLACE_WITH_THE_FILE_HASH"
        crossorigin="anonymous"
      ></script>

      Hash: curl -s <url> | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <script src="./k-otp.iife.min.js"></script>
  </head>
  <body>
    <main>
      <h1>Phone verification</h1>
      <p id="mode"></p>
      <form id="send">
        <input name="phoneNumber" inputmode="tel" placeholder="01012345678" required />
        <button type="submit">Send code</button>
      </form>
      <form id="verify" hidden>
        <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required />
        <button type="submit">Verify</button>
      </form>
      <p id="status" role="status"></p>
    </main>

    <script>
      // A pk_ PUBLIC key. Its allowedOrigins must list this page's exact origin
      // (e.g. http://localhost:5173 while developing). Never use an sk_ key here.
      const PUBLIC_KEY = "";

      // Without a key, answer from a tiny in-page mock (the code is 123456).
      const mockFetch = async (input, init) => {
        const request = new Request(input, init);
        const body = await request.json();
        await new Promise((r) => setTimeout(r, 300));
        const now = Date.now();
        const reply = (data) => Response.json(data);
        if (request.url.endsWith("/issue")) {
          return reply({ issueId: `mock-${body.idempotencyKey}`, expiresAt: new Date(now + 180000).toISOString(), attemptsRemaining: 5, queuedAt: new Date(now).toISOString() });
        }
        const verified = body.code === "123456";
        return reply({ issueId: body.issueId, verified, reasonCode: verified ? undefined : "MISMATCH", attemptsRemaining: verified ? 5 : 4, expiresAt: new Date(now + 60000).toISOString(), verifiedAt: verified ? new Date(now).toISOString() : undefined });
      };

      const client = PUBLIC_KEY
        ? KOtp.createOtpClient({ apiKey: PUBLIC_KEY })
        : KOtp.createOtpClient({ apiKey: "pk_mock", fetch: mockFetch });
      document.getElementById("mode").textContent = PUBLIC_KEY ? "" : "Mock mode: the code is 123456.";

      // The same headless flow the React/Vue/Svelte adapters use: one
      // idempotency key per send attempt (reused after ambiguous failures),
      // the default 30 s resend cooldown (plus the server's retryAfterMs) and
      // verify state.
      const flow = KOtp.createOtpFlow(client, { idempotencyKeyPrefix: "signup" });

      const sendForm = document.getElementById("send");
      const verifyForm = document.getElementById("verify");
      const status = document.getElementById("status");
      const sendButton = sendForm.querySelector("button");
      const verifyButton = verifyForm.querySelector("button");

      // Shared by both operations.
      const describeCommonError = (error) => {
        switch (error.code) {
          case "TOO_MANY_REQUESTS":
            return `Too many attempts. Try again in ${Math.ceil((error.retryAfterMs ?? 0) / 1000)}s.`;
          case "FORBIDDEN":
            return "This origin is not allowed for the public key.";
          default:
            return undefined;
        }
      };
      const describeSendError = (error) => {
        if (error.code === "PAYMENT_REQUIRED") return "Sending is temporarily unavailable.";
        if (error.retryable) return "Could not confirm the code was sent. Retrying is safe.";
        return describeCommonError(error) ?? `Could not send the code (${error.code}).`;
      };
      const describeVerifyError = (error) => {
        if (error.retryable) return "Could not check the code. Please try again.";
        return describeCommonError(error) ?? `Could not check the code (${error.code}).`;
      };

      const sendLabel = (s, seconds) => {
        if (s.issueState.isLoading) return "Sending...";
        if (seconds > 0) return `Resend in ${seconds}s`;
        if (s.idempotencyKey) return "Retry";
        return s.issueId ? "Resend code" : "Send code";
      };

      const statusText = (s) => {
        if (s.verified) return "Verified!";
        // `s.error` is the latest error of either operation: word it per operation.
        if (s.error && s.error === s.verifyState.error) return describeVerifyError(s.error);
        if (s.error) return describeSendError(s.error);
        if (s.reasonCode === "MISMATCH") return `Wrong code, ${s.attemptsRemaining} attempts left.`;
        if (s.reasonCode) return `This code can no longer be used (${s.reasonCode}). Request a new one.`;
        return s.issueId ? "Code sent." : "";
      };

      const render = () => {
        const s = flow.getState();
        const seconds = Math.ceil(s.cooldownRemainingMs / 1000);
        sendButton.disabled = !s.canSend;
        sendButton.textContent = sendLabel(s, seconds);
        verifyForm.hidden = !s.issueId;
        verifyButton.disabled = !s.canVerify;
        status.textContent = statusText(s);
      };

      // API failures resolve into the state; only configuration mistakes
      // (e.g. a malformed key) reject, so show those too.
      const reportFailure = (error) => {
        status.textContent = `Could not start the request (${error?.message ?? error}).`;
      };
      flow.subscribe(render);
      render();

      sendForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const phoneNumber = String(new FormData(sendForm).get("phoneNumber"));
        flow.send({ phoneNumber, purpose: "signup" }).catch(reportFailure);
      });
      verifyForm.addEventListener("submit", (event) => {
        event.preventDefault();
        flow.verify(String(new FormData(verifyForm).get("code"))).catch(reportFailure);
      });
    </script>
  </body>
</html>
