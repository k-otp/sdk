# Sampo configuration for github.com/k-otp/sdk
version = 1

[git]
default_branch = "main"

[github]
repository = "k-otp/sdk"

[packages]
# Ignore any package that can't be published (e.g. "private": true).
ignore_unpublished = true

# Keep the workspace root, tests and examples out of versioning/release flows
# (they are private as well). The only released package is npm/@k-otp/sdk
# (packages/sdk); its subpaths (/core, /server, /react, ...) share its version.
ignore = [
  "npm/k-otp-sdk-workspace",
  "npm/k-otp-sdk-tests",
  "npm/k-otp-example-*",
]
